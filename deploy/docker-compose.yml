name: neurocanino
x-api: &api
  NODE_ENV: production
  APP_ENV: ${APP_ENV:?}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:?}
  DB_USER: ${DB_USER:?}
  DB_PASSWORD: ${DB_PASSWORD:?}
  UPLOAD_DIR: /data/uploads
  CRM_PROVIDER: local
  SEED_DEMO: 'false'
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-El Neurocanino <info@adiestracaninos.es>}
  NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  migrate:
    image: ${BACKEND_IMAGE:?}
    profiles: [tools]
    user: root
    environment: *api
    volumes: [uploads:/data/uploads]
    command:
      [
        sh,
        -c,
        'chown -R node:node /data/uploads && node dist/cli/migrate.js && node dist/cli/seed.js',
      ]
    depends_on: { db: { condition: service_healthy } }
    logging: *logging
  backend:
    image: ${BACKEND_IMAGE}
    environment: *api
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    logging: *logging
  frontend:
    image: ${FRONTEND_IMAGE:?}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      SITE_URL: ${SITE_URL:?}
      API_INTERNAL_URL: http://backend:3000/api/v1
      HOST: 0.0.0.0
      PORT: 4321
    depends_on: { backend: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4321/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    logging: *logging
  proxy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      APP_ENV: ${APP_ENV}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes: [./runtime/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: { frontend: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging
volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
